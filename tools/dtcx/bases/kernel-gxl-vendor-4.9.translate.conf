## Amlogic's 4.9 BSP trees into mainline's dialect, for translate.py.
##
## The SoC's facts are mainline's dtsi as our -next kernel builds it, GXLX2's from its own dtsi
## (patches/linux-meson/0008); this is the vendor's vocabulary, each token's outcome. A drop needs
## a comment directly above it saying why it is safe, a question one saying what it asks; a
## comment covers the rules below it, up to the next blank line. ## lines are headings.

soc https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/arch/arm64/boot/dts/amlogic/meson-gxlx2-s905l3.dtsi?id=c03c1a14507dfaf8b856c2608f9ac216021fc222
soc-patches kernel/meson64-next.conf
pin-functions https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/drivers/pinctrl/meson/pinctrl-meson-gxl.c?id=c03c1a14507dfaf8b856c2608f9ac216021fc222
cells / 2 2
cells soc 2 2
cells cbus 2 2
cells aobus 2 2
cells periphs 2 2
cells hiubus 2 2
cells reserved-memory 2 2
cells pinctrl 2 2

## Names

label CPU{n} cpu{n}
label gpu mali
label control cpu_passive
label hot cpu_hot
label critical cpu_critical
name soc_thermal cpu-thermal
# the vendor's gpio-leds children, named by colour; the binding's are led-<name>
name sys_{w} led-{w}

# mainline's GXL pin data names these functions and groups apart from the vendor's
value function ao_cec cec_ao
value function hdmi_ddc hdmi_i2c
value function remote remote_input_ao
value groups remote_input remote_input_ao

compatible gpio-leds gpio-leds
compatible amlogic,meson-gx-i2c amlogic,meson-gxbb-i2c
compatible ramoops ramoops

## The SoC's wiring of a block: mainline's dtsi states it for the node the vendor's meets

prop compatible reg interrupts interrupt-names mainline
prop clocks clock-names resets reset-names mainline
prop ranges device_type enable-method method mainline
prop #address-cells #size-cells #gpio-cells #interrupt-cells #clock-cells #reset-cells mainline
prop #pwm-cells #io-channel-cells #mbox-cells mainline
prop interrupt-parent interrupt-controller gpio-controller reg-names mainline
prop mboxes mbox-names mainline
# lima registers the GPU as a cooling device where the node says it is one, as the vendor's does
prop #cooling-cells@arm,mali-450 same
prop #cooling-cells mainline

# dtc assigns phandles; every reference is by label
prop phandle none

# the vendor's own SoC identity beside compatible: does anything on the board need it?
prop amlogic-dt-id unresolved

## The board's status

prop status as status
value status disable disabled
value status ok okay

## Aliases, /chosen and memory

prop serial{n}@aliases alias
prop model same

# U-Boot writes the RAM it found into the memory node's reg; linux,usable-memory, which the
# kernel prefers, would cap every unit at the factory's size (bring-up/trees.md)
prop linux,usable-memory none

## Reserved memory

prop record-size console-size ftrace-size same

# the vendor secmon driver's buffer pool at BL31's base; mainline reserves BL31 there itself
# (secmon@10000000, no-map), and meson_sm maps the shared memory the firmware names
node linux,secmon none

# disabled, and exactly mainline's BL32 window (secmon@5300000, no-map)
node amlogic,aml_secos_memory none

# pools for the vendor's display, video and ION drivers; mainline's allocate from the default
# CMA pool, sized on the kernel command line (BOARD_CMDLINE's cma=)
node linux,meson-fb linux,di_cma linux,ion-dev linux,ppmgr linux,codec_mm_cma none
node linux,picdec linux,vdin1_cma amlogic,codec-mm-reserved none

## Pins: Amlogic's groups are mainline's binding already

prop groups as groups
prop function as function
prop bias-pull-up bias-pull-down input-enable same
prop pinctrl-names pinctrl-{n} pinctrl

# the vendor MMC driver runs a host on its all-pins state, the others for card init, 1-bit
# transfers and UART or JTAG on the SD pins; meson-gx-mmc applies default, and clk-gate if named
state emmc_all_pins@amlogic,meson-mmc-gxlx sd_all_pins@amlogic,meson-mmc-gxlx as default
state sdio_all_pins@amlogic,meson-mmc-gxlx as default

# never selected by meson-gx-mmc, which applies only default and clk-gate
state emmc_clk_cmd_pins@amlogic,meson-mmc-gxlx sdio_clk_cmd_pins@amlogic,meson-mmc-gxlx none
state sd_clk_cmd_pins@amlogic,meson-mmc-gxlx sd_1bit_pins@amlogic,meson-mmc-gxlx none
state sd_clk_cmd_uart_pins@amlogic,meson-mmc-gxlx sd_1bit_uart_pins@amlogic,meson-mmc-gxlx none
state sd_to_ao_uart_pins@amlogic,meson-mmc-gxlx ao_to_sd_uart_pins@amlogic,meson-mmc-gxlx none
state ao_to_sd_jtag_pins@amlogic,meson-mmc-gxlx sd_to_ao_jtag_pins@amlogic,meson-mmc-gxlx none

## CPUs, timers and interrupts

prop cpu same
prop clock-frequency clock-output-names same

# the vendor's broadcast timer, for cores its idle states stop; mainline's GX tree has no idle
# states, so a core idles in WFI, where the architected timer keeps time
node arm,meson-bc-timer none

# Cortex-A15's PMU model on Cortex-A53 cores; mainline's arm-pmu node describes these cores
node arm,cortex-a15-pmu none

# the vendor's map of bus windows for its drivers' raw register access; mainline's drivers map
# their own reg
node amlogic,iomap amlogic,codec_io none

# the vendor's SCPI clocks; mainline's scpi node describes the same SCP's DVFS clocks
node arm,scpi-clks none

# the vendor's MHU, the mailbox to the SCP at 0xc883c400; mainline's dtsi has the same block as
# mailbox@404, its registers counted from 0x404
node mhu none

## Firmware and boot chain

# the vendor's secure-monitor, key-store and licence interfaces for its own drivers; mainline's
# meson_sm (firmware secure-monitor) serves the chip serial, and our boot chain stores no keys
node amlogic,secmon aml,securitykey amlogic,unifykey amlogic,defendkey amlogic,audio_data none
node amlogic,efuse efusekey amlogic,cpuinfo none

# Android's fstab and verified boot and the vendor's partition tables, read by Android and its
# U-Boot; Linux reads neither
node android,firmware partitions none

# the vendor's suspend and reboot drivers; mainline reboots through PSCI, and suspend is a
# board's bring-up to measure (bring-up/trees.md)
node amlogic,pm aml,reboot none

# DRAM bandwidth and monitor drivers for the vendor's tools; nothing in mainline reads them
node amlogic,ddr-bandwidth amlogic,dmc_monitor none

# the vendor's JTAG pin switch, disabled; mainline muxes no JTAG
node amlogic,jtag none

# the vendor's SPI NOR and raw NAND drivers, both disabled: these boxes boot from eMMC
node amlogic,aml-spi-nor amlogic,aml_mtd_nand none

# the vendor's virtual RTC: its alarm register (AO 0xa8) is the one the SCP reads to wake from
# suspend, and mainline's meson-vrtc drives, with no node in mainline's GXL tree; does the
# board's suspend need it?
node amlogic,aml_vrtc unresolved

# the vendor's watchdog driver; mainline's meson-gxbb-wdt drives the SoC's watchdog at
# watchdog@98d0
node amlogic,meson-wdt none

## Video, display and the vendor's media frameworks

# the vendor's media stack: decoders, encoders, scalers, its video layer and buffer managers;
# mainline's meson-vdec, meson-drm and the V4L2 codecs do these through their own nodes
node amlogic,amvideom amlogic,vout amlogic,meson-gxl amlogic,ge2d-gxl amlogic,codec,mm none
node amlogic,meson,canvas amlogic,codec,streambuf amlogic,vdec amlogic,picdec amlogic,ppmgr none
node amlogic,deinterlace amlogic,tunnel_sync amlogic,ionvideo amlogic,amlvideo none
node amlogic,meson_uvm amlogic,meson_videotunnel amlogic,video_composer amlogic,dvb none
node amlogic,vdin amlogic,vecm amlogic,vpu-gxl none
node amlogic,meson,rdma amlogic,ion_dev amlogic,cvbsout-gxlx amlogic,vdac-gxlx none

# the encoders' nodes, which our meson-venc modules (patches/meson-codecs/0004, 0005) find by
# compatible: their interrupt, and the HEVC encoder's register window in its io_reg_base child,
# which venc-hevc's probe maps (else it takes SM1's address); kept as the vendor wrote them
compatible amlogic,amvenc_avc amlogic,amvenc_avc
compatible cnm,HevcEnc cnm,HevcEnc
node amlogic,amvenc_avc cnm,HevcEnc same

# the vendor driver's /dev name; mainline's drivers name their devices themselves
prop dev_name none

# the vendor's HDMI transmitter driver, as mainline's hdmi_tx enabled and its type A socket
node amlogic,amhdmitx hdmi-connector hdmi_tx hdmi_tx_tmds_port

# the vendor's CEC driver, enabled where CEC is wired: mainline's AO-CEC on the vendor's pins
node amlogic,amlogic-aocec cec cec_AO hdmi_tx

## GPU

# the vendor Mali driver's power domains, DVFS table and clock settings; lima scales the GPU
# by devfreq over mainline's gpu_opp_table, and VDDEE, the GPU's rail, is fixed
prop pmu_domain_config pmu_switch_delay num_of_pp def_clock sc_mpp tbl control_interval none
node clk{n}_cfg none

## Thermal

prop polling-delay polling-delay-passive sustainable-power same
prop temperature hysteresis type trip cooling-device contribution same

# a trip mainline's zone lacks (the vendor's switch_on), and the vendor's GPU cooling map, in
# the names the thermal binding allows: trips take no unit address, maps start with map
name trip-point trip-
name gpufreq_cooling_map map-gpu

# the vendor's aml-thermal reads the SoC sensor through the SCP; mainline's zone reads it
# through scpi_sensors
prop thermal-sensors mainline
node amlogic,aml-thermal none

# cooling devices of the vendor's aml-thermal driver (CPU frequency, CPU hot-unplug, GPU
# cores); mainline's maps cool the CPUs by cpufreq at the same trip
node cpufreq_cooling_map cpucore_cooling_map gpucore_cooling_map none

## MMC hosts

node amlogic,meson-mmc-gxlx same
prop bus-width max-frequency non-removable cap-sd-highspeed cap-mmc-highspeed disable-wp same

# the vendor host's per-slot node, its settings for its own driver, as mainline's host properties
# (conversions.py aml_slot): on GXL the eMMC is controller C, the SD slot B, SDIO A
node emmc aml-slot sd_emmc_c
node sd aml-slot sd_emmc_b
node sdio aml-slot sd_emmc_a

value caps MMC_CAP_MMC_HIGHSPEED cap-mmc-highspeed
value caps MMC_CAP_SD_HIGHSPEED cap-sd-highspeed
value caps MMC_CAP_NONREMOVABLE non-removable
value caps MMC_CAP_HW_RESET cap-mmc-hw-reset
value caps MMC_PM_KEEP_POWER keep-power-in-suspend
value caps MMC_CAP_SDIO_IRQ cap-sdio-irq

# none needed: bus-width carries the data width, and mainline's core erases and sends CMD23
# whenever the card can
value caps MMC_CAP_4_BIT_DATA -
value caps MMC_CAP_8_BIT_DATA -
value caps MMC_CAP_ERASE -
value caps MMC_CAP_CMD23 -

# UHS signalling needs a vqmmc-supply that reaches 1.8 V, which the vendor never describes; the
# card's rail is fixed at 3.3 V, and the card stays at high speed
value caps MMC_CAP_UHS_SDR{n} -

## Ethernet

# the vendor driver's PHY choice and calibration: internal_phy says the SoC's own PHY; what
# phy-mode and phy-handle does the board need?
prop internal_phy mc_val_internal_phy mc_val_external_phy cali_val unresolved
prop rst_pin-gpios GPIOZ4_pin-gpios GPIOZ5_pin-gpios unresolved

## USB

# the vendor PHY and controller drivers' port numbering and clock source; mainline's
# meson-gxl-usb-ctrl and its PHYs take theirs from mainline's nodes
prop portnum usb-phy cpu-type clock-src none
node amlogic,dwc2 none

## Serial, I2C, PWM, SPI

# mainline's dtsi states UART A's 128-byte FIFO as fifo-size, and the others are meson_uart's
# default, 64, the vendor's same; the tick source is the vendor driver's, mainline's is xtal
prop fifosize xtal_tick_en none

# the vendor serial driver's magic SysRq switch; mainline's is CONFIG_MAGIC_SYSRQ_SERIAL
prop support-sysrq none

# the vendor's fourth I2C master, disabled: mainline's GXL dtsi describes none at 0xc1108d20,
# and its two interrupts fit no meson-i2c binding
node i2c@8d20 none

# the vendor's PWM C/D at 0xc1108640, enabled with nothing using it; mainline's C/D block is
# at 0xc1108650, so the vendor's node says nothing about mainline's
node pwm@8640 none

# the vendor's SPI controller beside mainline's spicc: is SPI used?
node amlogic,spicc unresolved

## Wi-Fi, Bluetooth, LEDs, keys, IR

# the vendor's Wi-Fi power line and 32 kHz sleep clock, as mmc-pwrseq-simple on the SDIO host
# and a pwm-clock (conversions.py aml_pwrseq, aml_32k)
node amlogic,aml_wifi aml-pwrseq sd_emmc_a
node wifi_pwm_conf aml-32k

# the vendor's Bluetooth power line: what does it drive?
node amlogic,bt-dev unresolved

prop label gpios default-state same

# the vendor's LED driver, disabled: its gpio-leds node describes the LEDs
node amlogic,sysled none

# the vendor's button driver: are the buttons fitted? If so gpio-keys
node amlogic,gpio_keypad unresolved

# the vendor's remote decoder settings and keymaps: which rc-core keymap names the remote?
prop protocol map max_frame_time unresolved
node custom_maps unresolved

# the vendor's IR transmitter, disabled
node amlogic,am_irblaster none

## Audio

# the vendor's ALSA card, enabled: the SoC's HDMI audio our GXLX2 dtsi describes, the AIU's I2S
# into the HDMI transmitter, enabled with the AIU
node aml,meson-snd-card enable hdmi_sound aiu

# the vendor card's DAIs beyond HDMI: does the board route S/PDIF, PCM or the analog codec?
node amlogic,aml-i2s-dai amlogic,aml-spdif-dai amlogic,aml-pcm-dai unresolved
node amlogic,aml-i2s amlogic,aml-pcm amlogic,aml-spdif-codec amlogic,pcm2BT-codec unresolved
node amlogic,aml_dummy_codec amlogic,aml_codec_T9015 aml,aml_snd_dmic unresolved

## Other blocks

# the vendor's clock-measure node; mainline's clock-measure@8758 measures the same clocks
node amlogic,gxlx-measure none

# the RNG's entropy estimate for the vendor's hwrng, 1000 in 1024; mainline's binding has none,
# and the hwrng core credits meson-rng its default, 1024
prop quality none
