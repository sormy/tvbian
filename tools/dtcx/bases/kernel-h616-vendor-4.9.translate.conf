## Allwinner's 4.9 BSP trees into mainline's dialect, for translate.py.
##
## The SoC's facts are mainline's dtsi as our -next kernel builds it, the superset one tree
## serves both kernels by; this is the vendor's vocabulary, each token's outcome. A drop needs
## a comment directly above it saying why it is safe; a comment covers the rules below it, up
## to the next blank line. ## lines are headings.

soc https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/arch/arm64/boot/dts/allwinner/sun50i-h616.dtsi?id=c03c1a14507dfaf8b856c2608f9ac216021fc222
soc-patches kernel/sunxi64-next.conf
cells soc 1 1
pin-group allwinner,pins
pin-functions https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/drivers/pinctrl/sunxi/pinctrl-sun50i-h616.c?id=c03c1a14507dfaf8b856c2608f9ac216021fc222
pin-functions https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/drivers/pinctrl/sunxi/pinctrl-sun50i-h616-r.c?id=c03c1a14507dfaf8b856c2608f9ac216021fc222

## Names

label sdc{n} mmc{n}
label gmac{n} emac{n}
label twi{n} i2c{n}
label cpu_opp_l_table cpu_opp_table
label aliases -
label dma0 dma
label udc usbotg
label cryptoengine crypto
label ahub_cpudai0 ahub
label s_cir0 ir
label wakeupgen gic
label speedbin_efuse cpu_speed_grade
label ths_calib ths_calibration
label cpu_crit cpu_critical

name opp_l_table opp-table-cpu
name timer_arch timer
name {w}_thermal_zone {w}-thermal
name opp opp-

# the AXP1530 is mainline's AXP313A, whose binding names its LDOs aldo1 and dldo1
name pmu@x-powers,axp1530 pmic
name ldo1@x-powers,axp1530 aldo1
name ldo2@x-powers,axp1530 dldo1

value function sdc{n} mmc{n}
value function twi{n} i2c{n}
value function s_twi{n} s_i2c
value function ir ir_rx
value function x32kfout clock
value function gmac{n} emac{n}
value function s_rsb0 s_rsb
value function h_pcm{n} i2s{n}

# the kernel probes only "okay" or "ok" (of_device_is_available())
value status disable disabled

compatible allwinner,sun50i-operating-points allwinner,sun50i-h616-operating-points
compatible x-powers,axp1530 x-powers,axp313a

## The SoC's wiring of a block: mainline's dtsi states it for the node the vendor's meets

prop compatible reg interrupts interrupt-names mainline
prop clocks clock-names mainline
prop iommus mainline
prop ranges device_type enable-method method mainline
prop #address-cells #size-cells #gpio-cells #interrupt-cells #clock-cells mainline
prop #cooling-cells@arm,mali-midgard same
prop #cooling-cells interrupt-parent interrupt-controller gpio-controller mainline
prop #thermal-sensor-cells #iommu-cells #dma-cells mainline
prop nvmem nvmem-names nvmem-cell-names mainline
prop arm,no-tick-in-suspend mainline

# dtc assigns phandles; every reference is by label
prop phandle linux,phandle none

## The board's status

prop status as status

# mainline's sun20i-gpadc needs a channel@ node per input, which only the keys question
# writes; with none it fails to probe, so the dtsi's off stands
prop status@allwinner,sunxi-gpadc none

# sys_config's enable flag, read by the vendor's drivers beside status, which says the same
prop *_used none

## Aliases and /chosen

prop serial{n}@aliases mmc{n}@aliases spi{n}@aliases alias

# alias stems only the vendor's drivers look up (disp, gmac, hdmi, ir, pmu, pwm, twi, lcd, tv,
# scr, nand...); mainline's drivers number their devices by the stems above
prop *@aliases none

# U-Boot replaces /chosen/bootargs with extlinux.conf's append; kernel arguments live in
# BOARD_CMDLINE
prop bootargs@chosen none

# U-Boot writes the initrd's place into the tree it boots
prop linux,initrd-start@chosen linux,initrd-end@chosen none

## Pins: Allwinner's legacy pin groups in the generic binding

prop allwinner,pins as pins
prop allwinner,function as function
prop allwinner,pull flag 0:bias-disable 1:bias-pull-up 2:bias-pull-down
prop pinctrl-names pinctrl-{n} pinctrl

# drive in steps of 10 mA from 10; 0xffffffff is sunxi's unset: the vendor's driver leaves the
# pad's drive as it is, and with no drive-strength so does mainline's
prop allwinner,drive scale drive-strength 10 10 0xffffffff:-

# the mux number for the vendor's driver; mainline's pinctrl takes the mux from its own pin
# table, by the function's name
prop allwinner,muxsel none

# pin names for the vendor driver's debugfs; nothing reads them to configure a pin
prop allwinner,pname none

# an output level for the vendor's standby GPIO code; mainline's sunxi pinctrl takes drive and
# bias from a group, no level (sunxi_pctrl_build_pin_config)
prop allwinner,data none

# never selected: none of 8250_dw, i2c-mv64xxx, spi-sun6i, sun4i-spdif calls
# pinctrl_pm_select_sleep_state()
state sleep@allwinner,sun50i-uart sleep@allwinner,sun50i-twi sleep@allwinner,sun50i-spi none
state sleep@allwinner,sunxi-spdif none

# the vendor's sleep group muxes io_disabled, a function mainline's pinctrl lacks: written, the
# state fails the EMAC's whole pinctrl, default included
state sleep@allwinner,sunxi-gmac none

# never selected: sunxi-mmc selects no pin state but its default
state sleep@allwinner,sunxi-mmc-v4p1x sleep@allwinner,sunxi-mmc-v4p6x none
state uart_jtag@allwinner,sunxi-mmc-v4p1x none

node gpio_bias bank-bias

## Firmware, coprocessor and boot-chain nodes

# the vendor's clock tree as nodes, for its clk driver; every block mainline's dtsi describes
# takes its clocks from there, from the ccu, r_ccu and rtc nodes
node allwinner,clk-init none

# SRAM the vendor's drivers and arisc firmware map by node; mainline's syscon@3000000
# describes the SRAM sections its drivers claim
node allwinner,sram_ctrl allwinner,sram_a{n} none

# register windows the vendor's clk and arisc code map by node; mainline's r_ccu maps the
# PRCM itself, and runs no arisc firmware
node allwinner,prcm allwinner,s_cpuscfg none

# the boot ROMs' addresses, read by the vendor's standby code; nothing in mainline jumps to
# the boot ROM
node allwinner,n-brom allwinner,s-brom none

# arisc, the AR100 coprocessor's firmware, and what it shares with Linux: memory, mailbox,
# locks, USB and suspend settings; mainline runs no arisc
node allwinner,sunxi-arisc allwinner,arisc_space allwinner,msgbox none
node allwinner,sunxi-hwspinlock allwinner,sun50iw9-usbstandby standby_param none

# ION heaps for the vendor's display and video drivers; mainline allocates through the DMA
# API, from CMA sized by `cma=` in BOARD_CMDLINE
node allwinner,sunxi-ion none

# DRAM parameters for the vendor's DRAM frequency driver and sys_config; boot0 trains DRAM
# before Linux from its own copy, and mainline scales no H616 DRAM clock
node allwinner,dram allwinner,sunxi-dramfreq dram_para{n} dram_select_para none

# the vendor's MBUS bandwidth driver; DRAM port priorities stay as boot0 set them, which is
# the vendor's default too
node allwinner,sun50i-mbus none

# second views of the SID for the vendor's secure-world driver; mainline reads the SID
# through efuse@3006000
node allwinner,sun50iw9p1-sid allwinner,sunxi-chipid none

# the vendor's MAC address manager; U-Boot writes the Ethernet and Wi-Fi addresses into the
# tree it boots, by ethernetN alias
node allwinner,sunxi-addr_mgt none

# Android's fstab and verified boot, read by Android's init; Linux reads neither
node android,firmware none

# the vendor's OP-TEE; our boot chain runs TF-A's BL31 alone, no TEE for a driver to reach
node linaro,optee-tz none

# the vendor BL31's CPU suspend state; TF-A without SCP firmware offers no CPU suspend, and
# with no idle state a core idles in WFI
node idle-states none

# points at the idle state dropped above
prop cpu-idle-states none

# the vendor's GIC proxy, for arisc's wake-up; mainline routes interrupts to the GIC itself,
# references renamed to it
node allwinner,sunxi-wakeupgen none

# sys_config tables, read by the vendor's boot0 and U-Boot; our U-Boot carries its own
# settings, and the kernel reads none of them
node *_para card_boot ir_boot_recovery target product platform clock none

# whether the vendor's U-Boot boots on power-on; ours always does
node allwinner,box_start_os none

# the vendor kernel's switch for its boot messages; the console's loglevel is on the kernel
# command line
node auto_print none

# a test node for the vendor's virtual-device driver; it describes no hardware
node allwinner,sun50i-vdevice none

# the vendor's broadcast timer; mainline keeps time on the architected timer, which runs in
# every state Linux reaches here
node allwinner,sun4i-a10-timer none

# the counter's rate is CNTFRQ, which TF-A sets; the binding keeps this for firmware that
# does not
prop clock-frequency@arm,armv8-timer none

## Power: the PMIC and its rails

# sys_config's PMIC boot voltages, 1000000 + mV, as the fixed rails the vendor's boot chain holds
node power_sply boot-voltage

# sys_config's per-PMIC tables for the vendor's U-Boot; power_sply above carries the voltages
node axp{n}_power_sply none

# in the H616 design DCDC1 is VDD-GPU-SYS
also x-powers,axp1530 supply gpu mali-supply reg_dcdc1

prop regulator-name regulator-min-microvolt regulator-max-microvolt same
prop regulator-always-on regulator-ramp-delay same

# the vendor core's delay per voltage step; mainline waits by regulator-ramp-delay, which the
# vendor writes on the rail cpufreq scales, and no other rail changes voltage
prop regulator-step-delay-us regulator-final-delay-us none

# axp20x reads no wakeup-source
prop wakeup-source@x-powers,axp1530 none

# a one-shot write to an RTC register the H616 manual does not list (irq-sun8i-nmi's
# sunxi_nmi_pad_control); mainline's NMI driver has no such step and runs H616 and H700 PMIC
# interrupts without it
prop pad-control-v1 none

## CPU and GPU operating points

prop cpu-supply opp-range
prop opp-hz opp-microvolt clock-latency-ns opp-shared operating-points-v2 same
prop nvmem-cells dynamic-power-coefficient same
prop opp-supported-hw bits 2:4
prop operating-points opp-v2 gpu_opp_table

# rows with no opp-supported-hw and only per-version opp-microvolt-<v>: mainline's cpufreq
# would select them on every bin, with no voltage it reads
node opp@{n}-ab none

# sun50i-cpufreq-nvmem reads the speed cell unnamed (of_nvmem_cell_get(np, NULL))
prop nvmem-cell-names@opp_l_table none

# the vendor Mali driver's own switches, idle power-off and DVFS; panfrost powers the GPU down
# by runtime PM and scales it by devfreq on its own
prop gpu_idle dvfs_status none

## Thermal

prop polling-delay polling-delay-passive thermal-sensors sustainable-power same
prop temperature type hysteresis trip cooling-device contribution same

# the power allocator governor's PID terms; our kernels do not build it
# (no CONFIG_THERMAL_GOV_POWER_ALLOCATOR), so nothing reads them
prop k_i k_po k_pu none

# the GPU's power model, read only by the power allocator governor, which our kernels do not
# build
node arm,mali-simple-power-model none

## MMC hosts

# the rail pair the vendor's sunxi-mmc switches between for 3.3 and 1.8 V signalling;
# mainline's switches one vqmmc-supply, which the board's patch names if it has one
prop v*mmc*sw-supply none

prop *-supply same
prop bus-width max-frequency non-removable keep-power-in-suspend same
prop mmc-ddr-1_8v mmc-hs200-1_8v no-sd no-mmc no-sdio same
prop sdio-used-1v8 bank-1v8

# the vendor host's tuning: sdc_io_1v8 says it signals at 1.8 V, sdc_tm4_* are sample points
# per speed, sdc_ex_dly_used and sdc_dis_host_caps adjust them; does the board's host need a
# 1.8 V vqmmc-supply, or a capability mainline's sunxi-mmc would otherwise claim?
prop sdc_* unresolved

# the vendor's 4.9 mmc core reads card detect inverted (mmc_gpio_get_cd: !raw ^ CD_ACTIVE_HIGH),
# set only by cd-inverted: with none, the vendor's cd-gpios is active low
prop cd-gpios gpio low pull

# SUNXI_SC_EN_RETRY, the vendor host re-sending a failed request; mainline's MMC core retries
# failed requests itself (mmc block's MMC_MAX_RETRIES)
prop ctl-spec-caps none

# keeps the vendor host from switching signal voltage; mainline's switches only through a
# vqmmc-supply, which these nodes are not given
prop sunxi-dis-signal-vol-sw none

# the card-detect bank's debounce clock; mainline's card detect runs on the reset default and
# the MMC core's own debounce
prop cd-used-24M none

# UHS signalling needs a vqmmc-supply that reaches 1.8 V, which the vendor gives only as its
# own rail pair (v*mmc*sw-supply); without one the card stays at high speed
prop sd-uhs-* none

# sunxi-mmc sets these itself on every host its H616 variant drives (sunxi_mmc_probe:
# caps |= ..._HIGHSPEED, SDIO_IRQ)
prop cap-sd-highspeed cap-mmc-highspeed cap-sdio-irq none

# sunxi-mmc gates its clocks in runtime PM on every host (sunxi_mmc_runtime_suspend)
prop sunxi-power-save-mode none

# skips the vendor MMC core's PM notifier; mainline's core registers none
prop ignore-pm-notify none

# mainline erases whenever the card can (mmc_card_can_erase); no host flag exists
prop cap-erase none

# host capabilities mmc_of_parse() does not read; sunxi-mmc sets neither, by what its
# controller does
prop cap-cmd23 cap-wait-while-busy none

# sunxi-mmc clears HS400 on every host (caps2 &= ~MMC_CAP2_HS400)
prop mmc-hs400-1_8v none

# mainline's mmc core turns the cache on for every card that has one
prop mmc-cache-ctrl none

# mainline's mmc core sets ERASE_GROUP_DEF on every eMMC of revision 3 or later
prop mmc-high-capacity-erase-size none

# the vendor host's sample-delay table; mainline's H616 host calibrates itself in new-timing
# mode and reads none (sun50i_h616_cfg)
prop sunxi-dly-* none

## Ethernet

# an empty phy-mode is sys_config's unset, which mainline's of_get_phy_mode() refuses
prop phy-mode none-if-empty same

# empty, the property names no gpio or supply; with a value it is the board's question
prop phy-rst gmac-power{n} none-if-empty

# dwmac-sun8i divides allwinner,*-delay-ps by 100 into the delay field the vendor writes raw
prop tx-delay scale allwinner,tx-delay-ps 100 0
prop rx-delay scale allwinner,rx-delay-ps 100 0

## USB

node allwinner,sunxi-otg-manager vbus
node usbc{n} vbus

# the vendor USB driver's controller index; mainline addresses each controller by its own node
prop hci_ctrl_no none

## Display and HDMI

also allwinner,sunxi-hdmi hdmi-connector hdmi hdmi_out
also allwinner,sunxi-disp enable de

# the bootloader's logo handed to the vendor's display driver; mainline's DRM starts its own
# pipeline
node allwinner,boot_disp none

# the vendor display driver's boot-time mode and framebuffer; mainline's DRM takes the mode
# from the EDID and allocates its own framebuffer
prop screen{n}_* fb{n}_* fb_base dev{n}_* disp_* def_output_dev boot_disp none

# the vendor display driver's boot-time channel setup; mainline's DRM sets up its own pipeline
prop chn_cfg_mode none

# memory for the vendor's secure video path; mainline has none to place
prop drm_region_* dram_region_mbytes none

# sys_config's LCD template, lcd_used 0 or absent: the vendor's display driver drives no panel
# from it, and mainline has none to drive
node allwinner,sunxi-lcd{n} unused-by lcd_used

# the vendor TV driver's settings; the encoder itself is mainline's tv-encoder@6524000, from
# its dtsi
node allwinner,sunxi-tv none

# how many hdmi_power{n} there are
prop hdmi_power_cnt none

# a supply by regulator-name, as the vendor's HDMI driver looks it up; with no regulator of
# that name, its lookup failed and it enabled nothing
prop hdmi_power{n} supply-name

# HDCP for the vendor's HDMI driver; mainline's sun8i-dw-hdmi implements none, so nothing
# reads it
prop hdmi_hdcp_enable hdmi_hdcp22_enable none

# mainline's dw-hdmi registers CEC whenever the controller has it (dw_hdmi_probe,
# HDMI_CONFIG0_CEC)
prop hdmi_cec_support none

# the vendor's check of its boot mode against the EDID; mainline's DRM offers only modes the
# EDID allows
prop hdmi_mode_check none

# 0 is off: no CEC wake, no CTS workarounds, no gpio switching HDMI power or DDC
prop hdmi_cec_super_standby hdmi_cts_compatibility flag 0:-
prop power_io_ctrl ddc_en_io_ctrl flag 0:-

# whether the vendor's U-Boot reads the EDID for its logo; mainline's DRM reads it at probe
prop hdmi_skip_bootedid none

## Audio

node allwinner,sunxi-hdmi-machine enable hdmi_sound

# sun4i-codec registers its own sound card from the codec node
node allwinner,sunxi-codec-machine none

# the vendor's card for the AHUB itself; mainline's HDMI card (hdmi_sound, enabled above) is
# what uses the hub
node allwinner,sunxi-ahub-machine none

# a sound card on one I2S unit (daudio{n}), S/PDIF or the DMIC: is anything wired to that
# unit? If so the board's patch writes it as a simple-audio-card on the audio hub
node allwinner,sunxi-*-machine unresolved

# the digital microphone input: is a microphone fitted? TV boxes rarely fit one
node allwinner,sunxi-dmic unresolved

# the AHUB's codec and I2S units; mainline's audio-hub (patches/linux-sunxi/0704) is the hub
# whole, each unit set up by the sound card that uses it
node allwinner,sunxi-ahub allwinner,sunxi-ahub-daudio none

# the vendor's index among the AHUB's CPU DAIs; mainline's audio-hub node is the hub whole
prop id@allwinner,sunxi-ahub-cpudai none

# sun4i-codec takes no supply, nor does its binding
prop avcc-supply@allwinner,sunxi-internal-codec none
prop vcc33_audio-supply@allwinner,sunxi-internal-codec none

prop lineout_vol@allwinner,sunxi-internal-codec implies allwinner,audio-routing "Line Out", "LINEOUT"

# analog gains and DRC and high-pass filters the vendor's codec driver sets at probe;
# sun4i-codec exposes the gains as ALSA controls, set from userspace, and has no DRC or filter
# to set
prop *_gain@allwinner,sunxi-internal-codec *_cfg@allwinner,sunxi-internal-codec none

# volumes the vendor's codec driver sets at probe; sun4i-codec exposes them as ALSA controls
prop *_vol@allwinner,sunxi-internal-codec none
prop ramp_func_used@allwinner,sunxi-internal-codec none

## Wi-Fi and Bluetooth

node allwinner,sunxi-wlan pwrseq &ccu CLK_PLL_SYSTEM_32K
clock clk_losc_out as &rtc CLK_OSC32K_FANOUT
# the vendor rfkill's reset line and its low-power driver's UART and wake line, as a Bluetooth
# node on that UART (conversions.py bluetooth_reset, bluetooth_uart), written only where the
# rfkill names a reset line: a UART-attached chip; the board's patch names the chip
node allwinner,sunxi-bt bluetooth-reset bt_rst_n
node allwinner,sunxi-btlpm bluetooth-uart

## Serial, I2C, SPI, PWM

# 2 is two wires, TX and RX: with no uart-has-rtscts mainline's 8250_dw drives no flow
# control either
prop uart{n}_type flag 4:uart-has-rtscts 2:-

# the vendor serial driver's line index; mainline numbers lines by their serialN alias
prop uart{n}_port none

# keeps the vendor I2C host awake for its super-standby; mainline's mv64xxx suspends with the
# system and does atomic transfers for the PMIC at power-off
prop no_suspend none

# chip selects and slave mode for the vendor's SPI driver: a question only where the board
# fits an SPI device, which spi-sun6i addresses by num-cs and the device's reg
prop spi{n}_cs_* spi_slave_mode unresolved

# boot_init_gpio's lines, set by the vendor's boot chain (the Tanix: PH6 high, PH7 low): what
# do they power or select? A gpio-hog or a fixed regulator in the board's patch, if anything
prop gpio{n} unresolved

# one PWM channel each; mainline's sun50i-h616-pwm node drives all six, and a consumer names
# its channel by index (pwms = <&pwm n ...>)
node allwinner,sunxi-pwm{n} none

# the vendor PWM driver's channel numbering; mainline's sun50i-h616-pwm counts its channels
# from its compatible
prop pwm-base pwm-number pwms@pwm none

## RTC, IR and keys

# the RTC's switch to an external 32 kHz crystal; mainline's H616 RTC clock driver
# (ccu-sun6i-rtc) models no external crystal and never sets that bit
prop auto_switch none

# the RTC's general-purpose registers the vendor's reboot-mode driver writes the next boot's
# mode to; mainline sets no reboot mode there, and our U-Boot reads none
prop gpr_* none

# rtc-sun6i makes the RTC a wakeup device itself
prop wakeup-source@allwinner,sunxi-rtc none

# mainline's sunxi-cir reads none, and its binding allows none
prop wakeup-source@allwinner,s_cir none

prop wakeup-source input-debounce same

# remotes' power keys, read by arisc to wake the box; mainline runs no arisc, and its rc-core
# keymap names the keys
prop ir_addr_code{n} ir_power_key_code{n} none

# mainline's sunxi-cir takes no supply
prop supply@s_cir supply_vol@allwinner,s_cir none

node key_boot_recovery recovery-key low

# the LRADC key ladder, each key its voltage and code: are the keys fitted? If so the board's
# patch writes them as sun4i-lradc-keys buttons
node allwinner,keyboard_1350mv unresolved

# the GPADC key ladder: its channel setup and each key's voltage (key{n}_vol, matched by *_vol)
# and code: are the keys fitted? If so the board's patch writes them as adc-keys on the GPADC
prop key{n}_val key_cnt unresolved

## Other blocks

# sun8i-ce sets its mod clock to 300 MHz itself (ce_h616_variant.ce_clks, by clk_set_rate()),
# the vendor's same rate
prop clock-frequency@allwinner,sunxi-ce none

prop clock-frequency model same

# sys_config's gpio_para: the LEDs, written as gpio-leds
node allwinner,sunxi-init-gpio leds

# the vendor driver's /dev name; mainline names its devices itself
prop device_name none

# no mainline binding for the H616's PCIe, transport stream, smartcard or EMCE
node allwinner,sun50i-pcie allwinner,sun50i-tsc allwinner,sunxi-scr allwinner,sunxi-emce unsupported

# no mainline binding for the H616's G2D, VP9 decoder (sun50i-h6-vpu-g2 is the H6's) or camera
# input
node allwinner,sunxi-g2d allwinner,sunxi-google-vp9 allwinner,sunxi-vin-media unsupported

# the EVB's alternative Wi-Fi's power control and a front-panel display chip: no mainline
# binding for either
node sprd,marlin3 oranth,fd650 unsupported

# the raw NAND controller, which mainline's sunxi_nand drives: is a NAND chip fitted? These
# boxes boot from eMMC
node allwinner,sun50iw9-nand unresolved

# the AC200 beside the H616: TV encoder and audio codec on i2c3 at 0x10, clocked by PWM5;
# mainline has no AC200 driver: is its composite output or codec wanted?
node allwinner,sunxi-ac200 allwinner,ac200_codec unresolved

# parts the vendor's common tree lists for any board: a VFD front panel, a spidev placeholder
# (rohm,dh2228fv) and an HYM8563 RTC: which, if any, does the board fit?
node amediatech,yxt_vfd rohm,dh2228fv rtc,hym8563 unresolved

# strap pins the vendor's board check reads against fixed values: what do they identify?
node allwinner,gpio_encrypt unresolved

# a voltage setting on a node no rule above names (the GPADC's keys among them): what rail
# or threshold does it set?
prop *_vol unresolved

# the GPADC's channel setup: which channel carries the key ladder?
prop channel* unresolved
