# Mainline headers for the experimental RK3528 kernel.
source gregkh/linux v7.3.4, include/
url https://raw.githubusercontent.com/gregkh/linux/v7.3.4/include
header dt-bindings/clock/rockchip,rk3528-cru.h
header dt-bindings/reset/rockchip,rk3528-cru.h
header dt-bindings/power/rockchip,rk3528-power.h
header dt-bindings/gpio/gpio.h
header dt-bindings/interrupt-controller/arm-gic.h
header dt-bindings/interrupt-controller/irq.h
header dt-bindings/pinctrl/rockchip.h
header dt-bindings/input/linux-event-codes.h
header dt-bindings/thermal/thermal.h
header dt-bindings/phy/phy.h
header dt-bindings/soc/rockchip,vop2.h
render cells gpio-flags gic rockchip-pins input-codes thermal opp-hz
cells clock-controller@ff4a0000 clocks,assigned-clocks,assigned-clock-parents CLK_ PCLK_ HCLK_ ACLK_ CCLK_ BCLK_ TCLK_ DBCLK_ MCLK_ DCLK_ SCLK_
cells clock-controller@ff4a0000 resets SRST_
cells protocol@14 clocks,assigned-clocks,assigned-clock-parents SCMI_
cells power-controller power-domains RK3528_PD_
rules kernel-rk3528-vendor-6.1
# the vendor's PVTM measurement in the CPU OPP table, kept for cpufreq-rockchip-pvtm
decimal rockchip,pvtm-freq rockchip,pvtm-volt rockchip,pvtm-sample-time rockchip,pvtm-voltage-sel
numbers rockchip,pvtm-offset
numbers default-brightness fixed-emmc-driver-type segments
