# Mainline 6.18, the kernel the H616 boxes run; its dt-bindings are ABI, so every later release
# numbers them the same
source torvalds/linux v6.18 (7d0a66e4bb9081d75c82ec4957c50034cb0ea449), include/
url https://raw.githubusercontent.com/torvalds/linux/7d0a66e4bb9081d75c82ec4957c50034cb0ea449/include
header dt-bindings/clock/sun50i-h616-ccu.h
header dt-bindings/clock/sun50i-h6-r-ccu.h
header dt-bindings/clock/sun6i-rtc.h
header dt-bindings/clock/sun8i-de2.h
header dt-bindings/clock/sun8i-tcon-top.h
header dt-bindings/reset/sun50i-h616-ccu.h
header dt-bindings/reset/sun50i-h6-r-ccu.h
header dt-bindings/reset/sun8i-de2.h
header dt-bindings/gpio/gpio.h
header dt-bindings/interrupt-controller/arm-gic.h
header dt-bindings/interrupt-controller/irq.h
header dt-bindings/input/linux-event-codes.h
header dt-bindings/leds/common.h
header dt-bindings/thermal/thermal.h
render cells gpio-flags gic input-codes thermal opp-hz
cells clock@3001000 clocks,assigned-clocks,assigned-clock-parents dt-bindings/clock/sun50i-h616-ccu.h CLK_
cells clock@3001000 resets dt-bindings/reset/sun50i-h616-ccu.h RST_
cells clock@7010000 clocks,assigned-clocks,assigned-clock-parents dt-bindings/clock/sun50i-h6-r-ccu.h CLK_R_
cells clock@7010000 resets dt-bindings/reset/sun50i-h6-r-ccu.h RST_R_
cells rtc@7000000 clocks dt-bindings/clock/sun6i-rtc.h CLK_
cells clock@8000 clocks dt-bindings/clock/sun8i-de2.h CLK_
cells clock@8000 resets dt-bindings/reset/sun8i-de2.h RST_
cells tcon-top@6510000 clocks dt-bindings/clock/sun8i-tcon-top.h CLK_TCON_TOP_
# mainline's own properties holding a bare reference, the first with an argument
refargs allwinner,sram
ref allwinner,planes allwinner,plane-mapping
rules kernel-h616-vendor-4.9
