## RK3528 vendor-to-mainline vocabulary
soc https://raw.githubusercontent.com/gregkh/linux/v7.3.4/arch/arm64/boot/dts/rockchip/rk3528.dtsi
soc-patches kernel/rk35xx-next2.conf
pin-group rockchip,pins
prop compatible reg interrupts interrupt-names mainline
prop clocks clock-names resets reset-names mainline
prop #address-cells #size-cells #clock-cells #reset-cells mainline
prop ranges interrupt-parent interrupt-controller gpio-controller mainline
prop #interrupt-cells #gpio-cells #iommu-cells #power-domain-cells mainline
prop status same
prop pinctrl-names pinctrl-{n} pinctrl
prop rockchip,pins same
# The compiler allocates phandles from named references.
prop phandle linux,phandle none

## Radio GPIO consumers
prop gpio_host_wake as host-wake-gpios
prop gpio_chip_wake as chip-wake-gpios
prop gpio_chip_en as reset-gpios

# Mainline USB PHY consumers use phy-supply for the OTG port too.
prop vbus-supply@otg-port as phy-supply

## Generic board bindings
compatible regulator-fixed regulator-fixed
compatible regulator-gpio regulator-gpio
compatible pwm-regulator pwm-regulator
compatible gpio-leds gpio-leds
# the vendor template's LED names, as the roles the shared LED hooks drive
also gpio-leds led-roles work-green:power work-red:standby normal:power standby:standby
compatible mmc-pwrseq-simple mmc-pwrseq-simple
compatible adc-keys adc-keys
# the template's volume-up key, these boxes' one button, which the boot loader reads for recovery
also adc-keys adc-recovery vol-up-key
compatible simple-audio-card simple-audio-card
compatible linux,spdif-dit linux,spdif-dit
compatible arm,cortex-a53-pmu arm,cortex-a53-pmu
compatible arm,idle-state arm,idle-state
compatible linaro,optee-tz linaro,optee-tz
compatible ramoops ramoops
compatible shared-dma-pool shared-dma-pool
compatible mmio-sram mmio-sram
compatible operating-points-v2 operating-points-v2
compatible simple-bus simple-bus
label cpu0_opp_table cpu_opp_table
label grf core_grf
label u2phy usb2phy
label u2phy_otg usb2phy_otg
label u2phy_host usb2phy_host
label combphy_pu combphy
label gpu_opp_table gpu_opp_table
prop model same
prop ethernet{n}@aliases serial{n}@aliases gpio{n}@aliases i2c{n}@aliases spi{n}@aliases alias
prop #dma-cells #io-channel-cells #phy-cells #pwm-cells mainline
# a cooling device the vendor's thermal zones name, which mainline's dtsi leaves off its CPUs
prop #cooling-cells same
prop arm,pl330-periph-burst arm,smc-id device_type enable-method method mainline
prop dma-names dmas gpio-ranges reg-io-width reg-shift shmem mainline
prop phy-handle phy-is-integrated phy-mode phy-names phys power-domains mainline
prop snps,axi-config snps,blen snps,mixed-burst snps,mtl-rx-config snps,mtl-tx-config mainline
prop snps,rd_osr_lmt snps,wr_osr_lmt snps,rx-queues-to-use snps,tx-queues-to-use snps,tso mainline
prop fifo-depth rockchip,pipe-grf rockchip,pipe-phy-grf rockchip,usbgrf mainline
prop bias-disable bias-pull-down bias-pull-up drive-strength input-schmitt-enable same
prop output-high output-low same
prop bus-width cap-mmc-highspeed cap-sd-highspeed cap-sdio-irq disable-wp same
# Both dw_mmc drivers use this delay before rescanning an inserted card.
prop card-detect-delay same
prop keep-power-in-suspend max-frequency mmc-hs200-1_8v mmc-pwrseq same
prop no-mmc no-sd no-sdio non-removable same
prop sd-uhs-sdr12 sd-uhs-sdr25 sd-uhs-sdr50 sd-uhs-sdr104 sd-uhs-ddr50 same
prop clock_in_out same
prop cpu cpu-supply cpu-idle-states dynamic-power-coefficient entry-method same
prop operating-points-v2 opp-hz opp-microvolt opp-shared clock-latency-ns same
prop regulator-* vin-supply pwm-supply pwms gpio* states enable-active-high same
prop reset-gpios post-power-on-delay-ms power-off-delay-us same
prop phy-supply vbus-supply vmmc-supply vqmmc-supply vref-supply same
prop polling-delay polling-delay-passive sustainable-power same
prop hysteresis cooling-device contribution temperature thermal-sensors trip type same
prop default-state label linux,default-trigger retain-state-suspended same
prop assigned-clocks assigned-clock-rates assigned-clock-parents mainline
prop nvmem-cells nvmem-cell-names mainline
prop bit* mainline

# The kernel command line belongs to the selected extlinux entry.
prop bootargs@chosen none

# Mainline's DW MMC takes the vendor's sample phase. The vendor's v2 tuning is a shortcut to the same
# end: the bootloader's phase first, then four coarse ones, then the full sweep mainline always runs
prop rockchip,default-sample-phase same
prop rockchip,use-v2-tuning none
# mainline probes every card type; the vendor's restriction to one only saves probe time
prop supports-sd supports-sdio none

# The vendor picks an OPP's voltage by the chip's PVTM bin: the bins' columns and the measurement
# stay for cpufreq-rockchip-pvtm; opp-microvolt becomes the highest bin's, for a chip it cannot bin
prop opp-microvolt-L{n} same
prop rockchip,pvtm-voltage-sel@cpu0-opp-table rockchip,pvtm-offset@cpu0-opp-table rockchip,pvtm-freq@cpu0-opp-table same
prop rockchip,pvtm-volt@cpu0-opp-table rockchip,pvtm-sample-time@cpu0-opp-table rockchip,grf@cpu0-opp-table same
# the GPU's PVTPLL sits in its own GRF, mainline's gpu_grf at the vendor GRF's 0x10000
prop rockchip,pvtm-voltage-sel@gpu-opp-table rockchip,pvtm-freq@gpu-opp-table same
prop rockchip,pvtm-volt@gpu-opp-table rockchip,pvtm-sample-time@gpu-opp-table same
prop rockchip,pvtm-offset@gpu-opp-table scale rockchip,pvtm-offset 1 -65536
prop rockchip,grf@gpu-opp-table implies rockchip,grf <&gpu_grf>
# the DMC: the board's supply and DDR rates; the dtsi wires its interrupt, clock and DFI, and the
# driver's simple_ondemand takes the vendor's thresholds, so dmc_ondemand's tuning goes
prop center-supply@rockchip,rk3528-dmc operating-points-v2@rockchip,rk3528-dmc same
prop interrupts@rockchip,rk3528-dmc interrupt-names@rockchip,rk3528-dmc clocks@rockchip,rk3528-dmc mainline
prop clock-names@rockchip,rk3528-dmc devfreq-events@rockchip,rk3528-dmc mainline
prop upthreshold downdifferential system-status-level auto-min-freq auto-freq-en none
prop opp-suspend same
# the per-chip floor: an OPP below the efuse-indexed value is raised to it. Every chip read here has
# index 1, under every bin's lowest voltage; a gap until the PVTM driver applies it
prop mbist-vmin none
# the PVTM's temperature correction (zero here) and its PVTPLL reading, which the PVTM driver does
# itself; the leakage column the DMC table does not have
prop rockchip,pvtm-* rockchip,leakage-voltage-sel none
# the system monitor's CPU floor while video plays; schedutil scales on load instead
prop rockchip,video-1080p-freq rockchip,video-4k-freq none
# the vendor's 10 °C voltage floor, which mainline's OPP core cannot apply (a gap on the RK3528 list)
prop rockchip,low-temp rockchip,low-temp-min-volt rockchip,temp-hysteresis none

# Vendor frameworks with no mainline binding: the codec service and tunnel, the boot logo and its
# LUT, the debug port, the SoC id reader, the system monitor, the dummy codec, and the vendor clock
# container (mainline supplies xin24m); the IOMMUs come from the codec rules below
node rockchip,mpp-service rockchip,video-tunnel rockchip,drm-logo rockchip,drm-cubic-lut none
node rockchip,debug rockchip,cpuinfo rockchip,system-monitor none
# the FIQ debugger's console: mainline's UART it numbers, on its pins
node rockchip,fiq-debugger console
node rockchip,dummy-codec clocks rockchip,iommu-v2 none
# the GPU's power model as its dynamic-power-coefficient, for the power allocator to throttle it
node simple-power-model gpu-power
# the suspend firmware's sleep, wake and PWM-regulator config, sent to BL31 at suspend: mainline has
# no sender, so deep suspend runs on BL31's defaults, untested
node rockchip,pm-rk3528 none
# hardware this kernel has no driver for: each a gap in the RK3528 list
node rockchip,avs-plus-decoder unsupported
node rockchip,vdpp-v1 enable vdpp
node rockchip,iep-v2 enable iep iep_mmu
node rockchip,rga2_core0 enable rga rga_mmu
node rockchip,crypto-v4 rockchip,sfc unsupported
# the DDR monitor: the next2 dtsi describes it
node rockchip,rk3528-dfi none
node rockchip,rk3528-bus gpu-bus-opp-table rockchip,clk-out unsupported
# inter-core locks and messages for a coprocessor no board here runs, disabled on each; the secure
# OTP, which only the secure world reads, through OP-TEE
node rockchip,hwspinlock rockchip,rk3528-mailbox rockchip,secure-otp none
# HDCP 2.x: no mainline driver
node rockchip,rk3528-hdmi-hdcp2 unsupported
# Rockchip's own sound-card driver: mainline's simple-audio-card on the same DAIs
node rockchip,hdmi rk-sound-card
# mainline's dwc3 node is flat: the vendor wrapper's child is the controller
node rockchip,rk3528-dwc3 wrapper
# the controller as the vendor runs it: its PHYs (a board may leave the USB3 lane unwired), role,
# speed and the quirks mainline's dwc3 has
prop phys@snps,dwc3 phy-names@snps,dwc3 dr_mode maximum-speed phy_type snps,usb2-lpm-disable same
prop snps,dis_enblslpm_quirk snps,dis_rxdet_inp3_quirk snps,dis_u2_susphy_quirk same
prop snps,dis-del-phy-power-chg-quirk snps,dis-tx-ipgap-linecheck-quirk snps,dis-u1-entry-quirk same
prop snps,dis-u1u2-quirk snps,dis-u2-entry-quirk snps,dis-u2-freeclk-exists-quirk same
prop snps,parkmode-disable-hs-quirk snps,parkmode-disable-ss-quirk same
# the vendor xHCI's own quirks; a host-only port needs no role detection
prop snps,xhci-trb-ent-quirk quirk-skip-phy-init extcon@snps,dwc3 none
# core_grf in the dtsi stands for the vendor's whole GRF syscon
node rockchip,rk3528-grf none
compatible rockchip,rk3528-sai rockchip,rk3528-sai
# mainline's dtsi describes SAI2 and SAI3 only: SAI0 carries the radio's Bluetooth PCM, its pins
# where the vendor enables it held unpulled through the radio's power-up; SAI1 the 8-channel I2S
node sai@ffb80000 radio-pcm
node sai@ffba0000 unsupported
# and the cards on them: the radio's Bluetooth audio and the microphone array
node bt-sound es7243-sound unsupported
compatible rockchip,rk3528-spdif rockchip,rk3568-spdif
label spdif_8ch spdif
compatible rockchip,rkrng rockchip,rk3576-rng
compatible rockchip,display-subsystem rockchip,display-subsystem
# the VOP's IOMMU, which the vendor drops beside the VOP as rockchip,iommu-v2
also rockchip,rk3528-vop enable vop_mmu
# the vendor's boot-logo routes and buffer; mainline's subsystem names its VOP ports itself
node route none
prop memory-region@rockchip,display-subsystem memory-region-names@rockchip,display-subsystem none
prop ports@rockchip,display-subsystem mainline
node rockchip,rk3528-pcie unsupported
compatible simple-audio-card simple-audio-card
compatible snps,dwc3 rockchip,rk3528-dwc3
# the vendor rfkill driver's Wi-Fi: its power and reset lines, which it raised to run the chip, in
# the SDIO power sequence; its host wake, suspend only, dropped: SDIO interrupts in band
node wlan-platdata rk-wlan
# its Bluetooth, which it powers and wakes: hci_h4's serdev node on the UART, its reset and wake
node bluetooth-platdata rk-bluetooth
# the vendor template's microphone array, on an I2C bus disabled on every board
node ES7243E_MicArray_{n} none
# the Bluetooth SCO codec, on SAI0 with the radio's PCM: a gap with them
node delta,dfbmcs320 unsupported

prop mali-supply pa-ctl-gpios same
# the vendor kernel's initial voltage: held there where no consumer's OPPs scale the rail
also pwm-regulator init-voltage
# mainline's dtsi carries each power domain's QoS registers itself
prop pm_qos none
# the vendor's whole-GRF handle: its CRU, GPU, codec, DFI and Wi-Fi drivers never read it, and VOP2
# inverts only RGB and BT.656 clocks with it; mainline's blocks name their own GRFs
prop rockchip,grf none
# the vendor PHY's RX signal-detect switch above a temperature; next2's PHY driver lacks it, a gap
prop rockchip,thermal-zone none
# the vendor's PWM IR driver; mainline reads the receiver as gpio-ir-receiver and a kernel keymap
prop remote_pwm_id remote_support_psci handle_cpu_id rockchip,key_table rockchip,usercode none
# the vendor's PWM-capture remote: mainline's GPIO receiver on its pin, the keymap the board's
node rockchip,remotectl-pwm pwm-ir
# The BSP's PWM applies its active pins only once a channel is used; mainline's default would claim
# them at probe and take shared pins (PWM5 against the Ethernet LED on the R69-1). A channel a
# regulator or another node drives takes them as its default: without them its output reaches no pin
state active used-as default

compatible fixed-clock fixed-clock
compatible ethernet-phy-ieee802.3-c22 ethernet-phy-ieee802.3-c22
prop #sound-dai-cells sound-dai simple-audio-card,* same
prop arm,psci-suspend-param entry-latency-us exit-latency-us min-residency-us local-timer-stop same
prop console-size ftrace-size pmsg-size record-size same
prop clock-frequency clock-output-names interrupt-affinity same
prop io-channel-names io-channels keyup-threshold-microvolt linux,code same
prop poll-interval press-threshold-microvolt retain-state-shutdown same
prop linux,cma-default reusable size same
prop tx_delay rx_delay snps,reset-gpio snps,reset-active-low snps,reset-delays-us same
# the vendor's boot-log reader in ramoops; mainline's keeps its own records
prop boot-log-count boot-log-size none

prop #thermal-sensor-cells reg-names iommus mainline
prop remote-endpoint mainline
prop rockchip,hw-tshut-mode rockchip,hw-tshut-polarity rockchip,hw-tshut-temp same

# vendor output tuning: VOP2's line-buffer and multi-area modes and the CTS switch are vendor driver
# features; dw-hdmi's DDC, which refuses DDC/CI's address, moves to the I2C controller on its pins
also rockchip,rk3528-dw-hdmi hdmi-ddc-i2c
prop ddc-i2c-scl-high-time-ns ddc-i2c-scl-low-time-ns esmart_lb_mode support-multi-area none
# dw-hdmi's audio CTS computed: the controller measures it right from the SAI's 32-bit slots
# (rk-sound-card); SAI clocks kept running between streams: a gap only if a TV clips audio's start
prop rockchip,cts-manual rockchip,always-on none
# the RK3528 HDMI pad senses no hot-plug itself: mainline's driver mirrors this GPIO into the
# sink-detect bit, and the pad's input works only while the driver holds its output bit set
prop hpd-gpios same

# Mainline's HDMI PHY provides its clock on the parent node, not this vendor child.
node clk-port none

## The radio's mainline GPIO consumers, with the vendor's raw pin levels.
compatible seekwave,sv6160lite seekwave,sv6160lite
# its reset is the SDIO power sequence's line, which takes one polarity
also seekwave,sv6160lite shared-reset
# dma_type is overwritten by skw_use_sdma; no carried driver reads seekwave_nv_name.
prop dma_type seekwave_nv_name none

# the vendor's MPP and TV-encoder nodes stand for mainline's V4L2 codecs, TVE and their IOMMUs, at
# the same clock rates; their GRF memory bits (grf-mem-*) only stock's Android kernel sets, and our
# vendor kernel and next2 decode without them
node rockchip,rkv-decoder-rk3528 enable vdec vdec_mmu
node rockchip,vpu-decoder-v2 enable vpu vdpu_mmu
node rockchip,rkv-jpeg-decoder-v1 enable jpegd jpegd_mmu
node rockchip,rkv-encoder-rk3528 enable rkvenc rkvenc_mmu
node rockchip,rk3528-tve enable tve

# mainline's HS400 properties as the vendor's; its enhanced strobe exists for HS400 only
prop mmc-hs400-1_8v mmc-hs400-enhanced-strobe same
prop fixed-emmc-driver-type same
prop mmc-hs200-enhanced-strobe none
# the vendor LED driver's shutdown inversion; the board's LED units set the shutdown state
prop rockchip,invert-on-shutdown none
# front-panel clock displays: the bus; the board's patch puts its panel on it
node fdhisi,fd650 unsupported
node rockchip,fd655_dev panel-bus clk_pin dat_pin
# the vendor's PDM microphone card; no box wires a PDM microphone
node pdm-mic-array none
# the vendor HDMI driver's power-saving pins; mainline keeps its default state
state idle none
