# Allwinner's 4.9 BSP built the H616 boxes' factory trees (Linux 4.9.170 by stock boot.log). Allwinner
# publishes that BSP for the H6, not the H616; its sun50iw9 tree names clocks as nodes and includes
# only the BSP's generic dt-bindings, the same in both
source Allwinner-Homlet/H6-BSP4.9-linux (e634a960316dddd1eb50f2a6cf237f2f1c6da3e6), include/
url https://raw.githubusercontent.com/Allwinner-Homlet/H6-BSP4.9-linux/e634a960316dddd1eb50f2a6cf237f2f1c6da3e6/include
header dt-bindings/gpio/gpio.h
header dt-bindings/interrupt-controller/arm-gic.h
header dt-bindings/interrupt-controller/irq.h
header dt-bindings/input/linux-event-codes.h
header dt-bindings/thermal/thermal.h
# no gpio-flags: the BSP's gpio cells are bank, pin, function, pull, drive, data
render gic input-codes thermal opp-hz
# Allwinner's own gpio properties: &pio then bank, pin, function, pull, drive, data
gpio bt_hostwake bt_wake chip_en wlan_hostwake wlan_regon recovery_key sprite_gpio0
gpio fd650_gpio_clk fd650_gpio_dat gpio0 gpio1 gpio_pin_1 gpio_pin_2
gpio gpio1_pin gpio2_pin gpio3_pin gpio4_pin gpio5_pin select_gpio0 select_gpio1 select_gpio2
gpio sensor0_pwdn sensor0_reset sensor1_pwdn sensor1_reset
# Allwinner's own properties holding bare references
ref act_handle flash_handle nvmem pwms sdhci-name vcc-dram sunxi,audio-codec sunxi,cpudai-controller*
ref sunxi,dmic-controller sunxi,spdif-controller
# Allwinner's own quantities. Hex stays where the BSP writes hex: DRAM register images (dram_tpr*,
# dram_dx_*, dram_mr*, dram_para*, dram_zq, dram_ca_dri), NEC remote codes (ir_*code*), I2C
# addresses (*twi_addr, *_slave), the 0x55aaaa55 "unset" of nand0_*, bitmasks and register words
# (opp-supported-hw, ctl-spec-caps, sdc_dis_host_caps, sdc_tm4_*, power_reg, pad-control-v1,
# arm,psci-suspend-param), addresses (reg_base, space*, ranges, heap-base, gpr_offset)
decimal allwinner,pull allwinner,muxsel allwinner,drive allwinner,data
decimal dram_clk dram_type dram_odt_en *_mbytes *_vol *_vol? *_vol??
decimal *_used *_enable *enable* *_en *_num *_number* *_cnt *_port *_type *_id *_index *_sel *_select
decimal *_mode *_mode? *_level *_state *_value *_status *_flag *flag *_init* *_power* *_light
decimal device_id hci_ctrl_no id heap-id heap-size interface num-lanes num-locks pwm-base pwm-number
decimal clock-mult clock-div #clocks tdm_num tdm_config slot_width_select pcm_lrck_period mclk_div
decimal frametype daudio_master audio_format signal_inversion pinconfig channel* chn_cfg_mode
decimal *-coefficient k_i k_po k_pu regulator-ramp-delay rx-delay tx-delay input-debounce
decimal operating-points pll? pll?? boot_clock vind0_clk smart_color lcdgamma4iep
decimal lcd_* fb?_* fb_base screen?_output_* dev?_* disp_* deu_mode boot_disp hdmi_*
decimal key? key?_* key_* *key_num ir_detect_time ir_press_times ir_work_mode ir_key_no_duplicate
decimal usb_* uart* type_addr_* vinc?_* sensor?_* actuator?_afvdd_vol flash?_type
decimal card_* sdc_ex_dly_used sdc_io_1v8 sdc_tm4_win_th sunxi-dly-* logical_start ts ts0config
decimal *_gain *_cfg dac_* digital_vol lineout_vol linein_gain gpu_idle no_suspend dragonboard_test
decimal burn_key eraseflag auto_fel debug_mode start_type standby_mode system_power storage_type
decimal pc_bias wlan_busnum rndis_wceis spi*_cs_* spi_slave_mode tv_pwm_ch tv_twi_id gpr_cur_pos
decimal gpr_len led_* *_press_* long_press_mode short_press_mode select_mode def_output_dev
decimal advert_enable ddc_en_io_ctrl vcc-dram
