# Allwinner's 5.4 BSP built the H618 boxes' factory trees (Linux 5.4.125 by the stock boot.img).
# Allwinner publishes no 5.4 tree for the sun50iw9; Orange Pi's H616/H618 kernel is that BSP, and its
# ccu headers number every clock and reset the factory blobs use as the blobs do
source orangepi-xunlong/linux-orangepi orange-pi-5.4-sun50iw9 (3a4a29414d558664847202f4d8919b8ab8bcf4a8), include/
url https://raw.githubusercontent.com/orangepi-xunlong/linux-orangepi/3a4a29414d558664847202f4d8919b8ab8bcf4a8/include/{header}
header dt-bindings/clock/sun50iw9-ccu.h
header dt-bindings/clock/sun50iw9-r-ccu.h
header dt-bindings/clock/sun50iw9-ccu-rtc.h
header dt-bindings/reset/sun50iw9-ccu.h
header dt-bindings/reset/sun50iw9-r-ccu.h
header dt-bindings/gpio/gpio.h
header dt-bindings/interrupt-controller/arm-gic.h
header dt-bindings/interrupt-controller/irq.h
header dt-bindings/input/linux-event-codes.h
header dt-bindings/thermal/thermal.h
render cells gpio-flags gic input-codes thermal opp-hz
cells ccu@3001000 clocks,assigned-clocks,assigned-clock-parents dt-bindings/clock/sun50iw9-ccu.h CLK_
cells ccu@3001000 resets dt-bindings/reset/sun50iw9-ccu.h RST_
cells r_ccu@7010000 clocks,assigned-clocks,assigned-clock-parents dt-bindings/clock/sun50iw9-r-ccu.h CLK_R_
cells r_ccu@7010000 resets dt-bindings/reset/sun50iw9-r-ccu.h RST_R_
cells rtc_ccu@7000000 clocks,assigned-clocks,assigned-clock-parents dt-bindings/clock/sun50iw9-ccu-rtc.h CLK_
# the 4.9 BSP's quantities and reference properties, which this BSP keeps
rules kernel-h616-vendor-4.9
# Allwinner's own gpio properties: &pio then bank, pin, flags
gpio bt_rst_n vfd_clock_gpio vfd_data_gpio vfd_stb_gpio gpio
