## Allwinner's 5.4 BSP trees into mainline's dialect, for translate.py: what this BSP writes
## differently from the 4.9 one, then the 4.9 BSP's rules for the vocabulary the two share. The
## vendor's behaviour named below is its 5.4.125 kernel's, as the stock vmlinux carries it.

soc https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/arch/arm64/boot/dts/allwinner/sun50i-h616.dtsi?id=c03c1a14507dfaf8b856c2608f9ac216021fc222
soc-patches kernel/sunxi64-next.conf
# the generic binding's groups, and sys_config's legacy ones
pin-group pins allwinner,pins

## The SoC's wiring of a block

prop resets reset-names #reset-cells #sound-dai-cells mainline
prop dmas dma-names dma-channels dma-requests mainline

# rates and parents the vendor's display, deinterlace and HDMI drivers expect set before probe;
# mainline's drivers set their own clocks' rates
prop assigned-clocks assigned-clock-parents assigned-clock-rates mainline

# the vendor's display clocks as nodes, for its clk-periph driver; mainline's display engine,
# TCONs and HDMI take their clocks from the ccu
node allwinner,periph-clock allwinner,pll-clock none

# the clock roots as fixed clocks; mainline's dtsi has the 24 MHz oscillator and takes the 32 kHz
# and internal oscillator from the RTC's clock outputs
node fixed-clock none
label dcxo24M osc24M

# the vendor U-Boot's own display and HDMI, for its boot logo, beside the blocks' real nodes
# under /soc; mainline's DRM starts its own pipeline
node uboot_disp@1000000 uboot_hdmi@6000000 none

# the vendor BL31's place; ours is TF-A's at 0x40000000, which mainline's dtsi reserves
node bl31 none

# the vendor's debugfs register dump; it describes no hardware
node allwinner,sunxi-dump-reg none

## Pins: the generic binding, the legacy one only where the generic is absent

prop pins drive-strength bias-disable bias-pull-up bias-pull-down same
prop function as function

# sys_config's copy of a group, which sunxi pinctrl reads only where the generic property is
# absent (sunxi_pctrl_parse_*_prop), in the 5.4 BSP as in mainline
prop allwinner,pins shadowed-by pins
prop allwinner,function shadowed-by function
prop allwinner,drive shadowed-by drive-strength
prop allwinner,pull shadowed-by bias-disable bias-pull-up bias-pull-down

# a group's bank voltage for the vendor's pinctrl; mainline's sets each bank's bias from its
# vcc-p?-supply's voltage
prop power-source none

# PF's rails for the vendor's per-state switch: its pinctrl sets PF's bias from the selected
# state's power-source, never from these (sunxi_pmx_request skips PF), and the SD card's default
# state is 3.3 V; with no PF supply, mainline leaves the bank at its reset 3.3 V mode
prop vcc-pf-supply@allwinner,sun50iw9-pinctrl vcc-pfo-supply@allwinner,sun50iw9-pinctrl none

# the 1.8 V pin state the vendor's sunxi-mmc selects on a UHS switch; mainline's selects only
# the default state, and runs the card at 3.3 V
state mmc_1v8@allwinner,sunxi-mmc-v4p1x mmc_1v8@allwinner,sunxi-mmc-v4p6x none

# never selected: sunxi-cir and spdif select no pin state but their default
state sleep@allwinner,s_cir sleep@allwinner,sunxi-snd-plat-spdif none

## GPIOs

# mainline's specifier: bank, pin and gpio.h flags, which the 5.4 mmc core reads as mainline's
prop cd-gpios same

## Regulators

compatible regulator-fixed regulator-fixed
prop gpio enable-active-high regulator-enable-ramp-delay same

## CPU operating points

name cpu-opp-table opp-table-cpu

# sun50i-cpufreq-nvmem reads the speed cell unnamed (of_nvmem_cell_get(np, NULL))
prop nvmem-cell-names@cpu-opp-table none

# the vendor's speed bin n is bit n and opp-microvolt-an, as mainline's speedn decodes the same
# efuse codes for bins 0 to 4 (sun50iw9_nvmem_xlate, sun50i_h616_efuse_xlate)
prop opp-supported-hw bits 0:0 1:1 2:2 3:3 4:4

# bins 5 and 6, the vendor's split of speed bin 0x5c00 on dies past revision A by two more SID
# fields; mainline reads that bin as speed4, the vendor's a4: which bin is this board's die?
prop opp-microvolt-a5 opp-microvolt-a6 unresolved

prop opp-microvolt-a{n} as opp-microvolt-speed{n}

## USB

# one VBUS regulator, which each host's driver enables; mainline's USB PHY enables it per port
also allwinner,sunxi-ehci{n} host-vbus
also allwinner,sunxi-ohci{n} host-vbus

# carried to the USB PHY above; mainline's EHCI and OHCI take no supply
prop drvvbus-supply none

## MMC hosts

# UHS: the SD slot has no fixed 1.8 V rail for it, and the Wi-Fi host, which has one, would run
# SDR104 untuned: mainline's sunxi-mmc has no execute_tuning. Both stay at high speed
prop sd-uhs-* none

# descriptor pages the vendor's sunxi-mmc allocates for its DMA; mainline's sizes its own
prop req-page-count none

## Serial

# the vendor's 8250 FIFO size; mainline's 8250_dw reads it from the UART's CPR register
prop sunxi,uart-fifosize none

## PWM

# the vendor PWM driver's list of its channel nodes; mainline's sun50i-h616-pwm drives all six
prop sunxi-pwms none

## Wi-Fi and Bluetooth

# the vendor's rfkill around the Wi-Fi and Bluetooth nodes the 4.9 BSP wrote alone; its 32 kHz
# clock-out pin state is theirs (with_state_of)
node allwinner,sunxi-rfkill wrapper
clock rtc_ccu:CLK_OSC32K_OUT as &rtc CLK_OSC32K_FANOUT

## Audio

# the codec's line out, which mainline's sun4i-codec routes by allwinner,audio-routing
prop lineout_vol@allwinner,sunxi-snd-codec implies allwinner,audio-routing "Line Out", "LINEOUT"

# the codec's TX through the audio hub for the vendor's mixing; sun4i-codec plays from its own
# DMA
prop tx_hub_en none

# DMA platforms: the vendor's buffer and FIFO sizes per card; mainline's ASoC sizes its own
node allwinner,sunxi-snd-plat-aaudio allwinner,sunxi-snd-plat-ahub none
prop playback_cma capture_cma tx_fifo_size rx_fifo_size pll-fs clk_parent none

# the audio hub's registers, under the vendor's DAM platform: mainline's audio-hub@5097000
label ahub_dam_plat ahub

# one compatible for every card, each told by its name. Hub unit 1 is the vendor's HDMI card (its
# platform's dai_type "hdmi"); mainline's HDMI card runs on the hub
node ahub1_mach enable hdmi_sound

# sun4i-codec registers its own card, and the DAM card mixes on the vendor's hub alone
node codec_mach ahub_dam_mach none

# a card on one I2S unit or S/PDIF: is anything wired to it? If so the board's patch writes it
# as a simple-audio-card on the audio hub
node ahub{n}_mach spdif_mach sunxi,simple-audio-card unresolved

# the DMIC's codec stub, with the DMIC itself (a question above)
node dmic-codec unresolved

## Display and RTC

# the supplies the vendor's HDMI driver enables by these names (hdmi_power_enable), each its
# <name>-supply; mainline's sun8i dw-hdmi takes one, its 1.8 V hvcc-supply, which the board's
# patch names: this tree leaves the rails' voltages to U-Boot
prop hdmi_power{n}@allwinner,sunxi-hdmi *-supply@allwinner,sunxi-hdmi none

# rtc-sun6i makes the RTC a wakeup device itself
prop wakeup-source@allwinner,rtc-v200 none

## Other blocks

# an EEPROM the vendor's common tree lists on i2c0: is one fitted?
node atmel,24c16 unresolved

rules kernel-h616-vendor-4.9
