# Steps known to break a box, not run there until the fix lands. One a line:
#   <boards> <kernels> step:<step>  # why, and the todo that fixes it
# Boards and kernels are globs, boards comma-separated; a family's line takes every board, `*`, and
# its kernels' glob. A step is skipped only where running it breaks the box: every other failure is
# reported, and judged in the report. Remove the line when its fix lands.
