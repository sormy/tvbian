# Failures we know and have not fixed, so a report shows what is new. One a line:
#   <boards> <kernels> <check, a regex over the report's line>  # why, and what retests it
# Boards and kernels are globs, boards comma-separated. Narrow: one check or case, never a whole
# codec or every firmware; remove the line when its fix lands.

h96max-3518*,h96max-m2-plus,h96max-rk3528,r69-1 * ^(composite|display-full): composite (PAL|NTSC) writeback colour bars LOST, (720x576|720x480)$  # RK3528 writeback reads back empty; docs/todo/rk35xx.md
h96max-3518*,h96max-m2-plus,h96max-rk3528,r69-1 * ^network: bt\.find: 0$  # needs a controlled BLE advertiser in range; environmental
h96max-3518*,h96max-m2-plus,h96max-rk3528,r69-1 * ^system: dmesg\.deferred: mtd_vendor_storage$  # vendor storage probes before its MTD; harmless
h96max-3518*,h96max-m2-plus,h96max-rk3528,r69-1 * ^system: drivers\.unbound: ffc40000\.crypto firmware:optee rkvtunnel$  # no OP-TEE; crypto has no consumer; rkvtunnel, the vendor's video tunnel, binds on none
h96max-m2-plus * ^system: drivers\.unbound: ffc40000\.crypto firmware:optee gpu-bus rkvtunnel$  # its factory tree enables gpu-bus, which nothing binds; docs/todo/rk35xx.md
h96max-3518*,h96max-m2-plus,h96max-rk3528,r69-1 * ^system: firmware\.failed: SWT6621S_DRAM_SDIO\.\S+ SWT6621S_IRAM_SDIO\.\S+ SWT6621S_SEEKWAVE_R00001\.\S+ sv6160lite\.\S+$  # the driver tries board-named firmware first, then the generic
h96max-3518*,h96max-m2-plus,h96max-rk3528,r69-1 * ^system: modules\.missing: aic8800_bsp aic8800_btlpm aic8800_fdrv$  # the kernel package names every radio's modules; docs/todo/README.md
r69-1 * ^system: modules\.missing: aic8800_btlpm skw_sdio_lite skwbt swt6621s_wifi$  # the other radios' modules; Bluetooth runs without btlpm
h96max-3518*,h96max-m2-plus,h96max-rk3528,r69-1 * ^video: video decode h264i 1920x1080: broken$  # interlaced H.264 through MPP; docs/todo/rk35xx.md
h96max-3518*,h96max-m2-plus,h96max-rk3528,r69-1 * ^video: video decode (h264|h264p10|hevc|hevc10|vp9|vp9p2) (8192x8192|16384x8640): broken$  # past the engine's limit, broken not refused; extended runs only
r69-1,h96max-h313 * ^network: wifi\.region\.(DE|US|JP): 98, not taken$  # the AIC8800 driver keeps its own regulatory domain
