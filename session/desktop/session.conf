# tvb-desktop: Debian's own desktop programs, with our defaults. The session itself is a depend;
# its apps are recommends, so each can be removed alone: install it with --install-recommends,
# as tvb-base turns recommends off
# PipeWire through its PulseAudio server, not pipewire-alsa: ALSA's default stays the hardware for
# a player beside the session
DEPENDS="labwc, waybar, greetd, gtkgreet, swaybg, swayidle, swaylock, fuzzel, mako-notifier,
  lxpolkit, pipewire-pulse, wireplumber, libspa-0.2-bluetooth, fonts-inter, fonts-font-awesome,
  whitesur-theme, libglib2.0-bin, dconf-gsettings-backend, librsvg2-common, qt6-gtk-platformtheme, wlr-randr,
  kanshi, grim, slurp, tvb-va-driver"
RECOMMENDS="foot, pcmanfm, falkon, mpv, featherpad, lximage-qt, qpdfview, xarchiver, galculator,
  lxtask, wdisplays, blueman, pavucontrol-qt, network-manager-gnome"
DESCRIPTION="TVBian's desktop: labwc with a menu bar and a dock, video through VA-API"
# out of releases until the desktop plays video; remove to release
HELD="video in Falkon is not watchable yet: the desktop's GPU path is too slow on Mali-450"
