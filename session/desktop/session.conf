# tvb-desktop: Debian's own desktop programs, with our defaults. The images install no
# recommends: what the desktop needs is a depend
DEPENDS="labwc, waybar, greetd, gtkgreet, cage, swaybg, swayidle, swaylock, foot, fuzzel,
  mako-notifier, lxpolkit, xdg-desktop-portal-wlr, xdg-desktop-portal-gtk, pipewire-audio,
  wireplumber, fonts-inter, whitesur-theme, libglib2.0-bin, dconf-gsettings-backend,
  librsvg2-common, wlr-randr, grim, wl-clipboard, pcmanfm, pavucontrol, network-manager-gnome,
  firefox-esr, mpv, tvb-va-driver"
RECOMMENDS="chromium, kanshi, glmark2-es2-wayland"
DESCRIPTION="TVBian's desktop: labwc with a menu bar and a dock, video through VA-API"
