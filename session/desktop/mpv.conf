# Decode on tvb-va-driver; in a Wayland session hand the frames to the compositor uncopied,
# elsewhere draw them on the GPU
hwdec=vaapi
vo=dmabuf-wayland,gpu
# Sites through yt-dlp: H.264 up to 1080p, which every family decodes and draws at full rate
ytdl-format=bestvideo[height<=?1080][vcodec^=avc1]+bestaudio/best
