# The kernel parameters every box boots with, after its board's own BOARD_CMDLINE: the last
# console= is /dev/console, so the screen. ro: systemd-fsck-root checks the rootfs first.
# net.ifnames=0: eth0 and wlan0. firmware_class.path: the board's firmware ahead of a package's.
TVB_CMDLINE="rootwait ro console=tty1 consoleblank=0 net.ifnames=0 firmware_class.path=/usr/lib/tvb/firmware"
