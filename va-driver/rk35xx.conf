# MPP through the vendor kernel's /dev/mpp_service
DEFINES="-DHAVE_MPP=1"
BACKENDS="backend_mpp.c"
# the vendor kernel's display holds renderD128, Lima the next node
DRM_DRIVERS="rockchip lima"
# libmpp, linked into the driver
LIBRARIES=mpp
DEPENDS=libstdc++6
MPP_REPO=https://github.com/rockchip-linux/mpp.git
# its 1.1.0 release
MPP_COMMIT=c08762ebfadeb4e986d2fed993bc7a54862d3ebe
