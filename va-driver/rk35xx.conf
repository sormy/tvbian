# MPP through the vendor kernel's /dev/mpp_service; the RGA for 10-bit pictures and copies
DEFINES="-DHAVE_MPP=1"
BACKENDS="backend_mpp.c"
# the vendor kernel's display holds renderD128, Lima the next node
DRM_DRIVERS="rockchip lima"
# libmpp and librga, linked into the driver
LIBRARIES="mpp rga"
DEPENDS=libstdc++6
MPP_REPO=https://github.com/rockchip-linux/mpp.git
# its 1.1.0 release
MPP_COMMIT=c08762ebfadeb4e986d2fed993bc7a54862d3ebe
# Rockchip's librga source survives only in mirrors
RGA_REPO=https://github.com/nyanmisaka/rk-mirrors.git
RGA_COMMIT=1d330cc28551943bed3380261a5a9c6fbd58ff53
