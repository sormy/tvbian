# wpewebkit: Debian's own source from sid, rebuilt for trixie, whose 2.48 has no WPEPlatform and
# no security support; Rockchip's MPP let into the web process's sandbox, and QtWebEngine's
# behaviour where qtwpewebkit needs it
SOURCE=wpewebkit
SOURCE_SUITE=sid
# the package the plan finds the extra by
PACKAGE=libwpewebkit-2.0-1
PATCHES="
  patches/wpewebkit/0001-GTK-WPE-Let-Rockchip-s-MPP-video-decoder-into-the-sandbox.patch
  patches/wpewebkit/0002-GLib-Add-FrameInfo-API.patch
  patches/wpewebkit/0003-GLib-Return-a-DOM-node-as-an-empty-object.patch
  patches/wpewebkit/0004-GLib-Add-webkit_navigation_action_is_popup.patch
  patches/wpewebkit/0005-GLib-A-scheme-handler-scheme-is-not-secure-by-itself.patch
  patches/wpewebkit/0006-GLib-Fetch-a-scheme-handler-scheme-only-when-CORS-enabled.patch
  patches/wpewebkit/0007-A-gesture-opens-one-window.patch
  patches/wpewebkit/0008-WPE-An-application-s-script-is-not-the-user-s-gesture.patch
  patches/wpewebkit/0009-GStreamer-A-media-download-pauses-no-lower-than-32MiB.patch
"
# <extra>:<package> it builds against, from build/out/debs
BUILD_WITH="librice:librice0 librice:librice-dev"
# out of releases until the desktop plays video; remove to release
HELD="video in Falkon is not watchable yet: the desktop's GPU path is too slow on Mali-450"
