# falkon: Debian's own source built on WPE WebKit through qtwpewebkit instead of QtWebEngine, so it
# paints and decodes video on the box's GPU and video engine
SOURCE=falkon
# the package the plan finds the extra by
PACKAGE=falkon
PATCHES="
  patches/falkon/0001-Build-on-WPE-WebKit-through-QtWpeWebKit.patch
  patches/falkon/0002-AdBlock-through-WebKit-content-blockers-on-QtWpeWebKit.patch
  patches/falkon/0003-Spellcheck-languages-of-the-system-s-Hunspell-dictionaries-on-QtWpeWebKit.patch
"
# <extra>:<package> it builds against, from build/out/debs
BUILD_WITH="librice:librice0 wpewebkit:libwpewebkit-2.0-1 wpewebkit:libwpewebkit-2.0-dev qtwpewebkit:libqtwpewebkit0
  qtwpewebkit:libqtwpewebkit-dev"
# out of releases until the desktop plays video; remove to release
HELD="video in Falkon is not watchable yet: the desktop's GPU path is too slow on Mali-450"
