# qtwpewebkit: QtWebEngine's API over WPE WebKit, from the repo's qtwpewebkit/, for Falkon
VERSION=$(sed -n 's/^project(qtwpewebkit VERSION \([0-9.]*\).*/\1/p' \
  "$(dirname "${BASH_SOURCE[0]}")/../../qtwpewebkit/CMakeLists.txt")
# the package the plan finds the extra by
PACKAGE=libqtwpewebkit0
# repo paths built into it, beside the extra's own files
SOURCES=qtwpewebkit
# <extra>:<package> it builds against, from build/out/debs
BUILD_WITH="librice:librice0 wpewebkit:libwpewebkit-2.0-1 wpewebkit:libwpewebkit-2.0-dev"
