# labwc: Debian's own source, a client's large buffer shown on a hardware plane instead of composited
SOURCE=labwc
# the package the plan finds the extra by
PACKAGE=labwc
# its planes stack a video under the composited output: wlroots' underlay layers
BUILD_WITH="wlroots:libwlroots-0.18 wlroots:libwlroots-0.18-dev"
PATCHES="
  patches/labwc/0001-output-show-the-largest-uncovered-client-buffer-on-a-hardware-plane.patch
"
# out of releases until the desktop's video is watchable
HELD="video in Falkon is not watchable yet: the desktop's GPU path is too slow on Mali-450"
