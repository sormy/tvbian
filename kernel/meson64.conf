# meson64: the kernel every Amlogic board runs. Read by the build; paths are relative to the repo.
REPO=https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
# the newest long-term release kernel.org lists; a kernel without FOLLOW pins COMMIT instead
FOLLOW=longterm
# the base config as a savedefconfig, then the fragment on top
CONFIG=kernel/meson64.defconfig
FRAGMENT=kernel/meson64.fragment

# "<directory in the kernel tree>:<patch file>", applied in order; DKMS-only patches are left out
