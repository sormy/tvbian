# rk35xx-next: rk35xx's patches, config and fragment on Rockchip's newest vendor series, to see the
# next series coming. Its metapackage is opt-in.
. kernel/rk35xx.conf
BRANCH='develop-*'
FRAGMENT="kernel/rk35xx.fragment kernel/rk35xx-next.fragment"
# rk35xx's, except: 6.12 moved asm/unaligned.h to linux/unaligned.h, beside what the h4 serdev patch
# touches
PATCHES="
  .:patches/linux-rockchip/input-remotectl-share-pwm-irq.patch
  .:patches/linux-rockchip/net-stmmac-skip-absent-mdio-reset-gpio.patch
  .:patches/linux-rockchip/6.12/bluetooth-hci-h4-serdev.patch
  .:patches/linux-rockchip/bluetooth-hci-h4-aic8800-bdaddr.patch
  .:patches/linux-rockchip/drm-rockchip-vop2-hdr-ext-data-size.patch
"
