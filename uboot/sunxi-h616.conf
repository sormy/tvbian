# The H616 boards' U-Boot, on mainline's Tanix TX1 defconfig; each board's DRAM settings come from its
# factory_boot0.bin.
REPO=https://github.com/u-boot/u-boot.git
TAG=v2026.10
DEFCONFIG=tanix_tx1_defconfig
# a USB disk boots before the eMMC, with no button to find
BOOT_PREBOOT='usb start; setenv boot_targets fel usb0 mmc_auto'
PATCHES=patches/u-boot/0004-sunxi-h616-dram-keep-two-3-4-populated-ranks-contiguous.patch
TFA_REPO=https://github.com/ARM-software/arm-trusted-firmware.git
TFA_TAG=v2.14
TFA_PLAT=sun50i_h616
TFA_PATCHES=patches/arm-trusted-firmware/0001-fix-allwinner-restart-the-watchdog-count-in-system-reset.patch
