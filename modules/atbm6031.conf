COMMIT=380838e871c793ff4feb19bd584d9508b162b835
KERNELS="sunxi64 sunxi64-next"
PATCHES="
  .:patches/atbm6031/0001-atbm6031-the-603x-on-sdio-on-linux-6.18.patch
  .:patches/atbm6031/0002-atbm6031-match-altobeam-s-sdio-ids-only.patch
  .:patches/atbm6031/0003-atbm6031-build-from-any-directory.patch
  .:patches/atbm6031/0004-atbm6031-build-on-6.12-and-later.patch
  .:patches/atbm6031/0005-atbm6031-wpa3.patch
  .:patches/atbm6031/0006-atbm6031-set-the-mac-through-eth_hw_addr_set.patch
  .:patches/atbm6031/0007-atbm6031-poll-for-free-tx-buffers-without-a-jiffy-s-sleep.patch
  .:patches/atbm6031/0008-atbm6031-release-the-sdio-bus-between-tx-buffer-polls.patch
  .:patches/atbm6031/0009-atbm6031-transfer-in-488-byte-sdio-blocks.patch
  .:patches/atbm6031/0010-atbm6031-build-on-6.19-and-later.patch
