  .:patches/atbm6031/0012-atbm6031-receive-through-napi-with-gro.patch
  .:patches/atbm6031/0013-atbm6031-reload-the-firmware-when-it-restarts-itself.patch
  .:patches/atbm6031/0014-atbm6031-restore-the-firmware-s-setup-after-a-restart.patch
  .:patches/atbm6031/0015-atbm6031-restart-the-firmware-when-it-latches-rx-at-dsss-cck.patch
  .:patches/atbm6031/0016-atbm6031-log-routine-events-at-debug-level.patch
  .:patches/atbm6031/0017-atbm6031-drop-a-flush-s-frames-when-joined-to-nothing.patch
"
# its Makefile reads .config from $(PWD), the directory make was run in; kbuild runs it from the
# kernel tree, where $(src) is the driver's. Its bare exports hand every recipe kbuild's
# size_append, a shell loop over each object's headers: empty, an hour's build takes seconds
MAKE_ARGS='PWD=$(src) size_append= -k'
